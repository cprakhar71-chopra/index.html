<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio with Images</title>
</head>
<body>

    <header>
        <h1>My Portfolio</h1>
    </header>

    <main>
        <section>
            <h2>About Me</h2>

            <img src="profile.jpg"
                 alt="Profile photo of the portfolio owner"
                 width="200">

            <p>Hello! I am a student learning web development.</p>
        </section>

        <section>
            <h2>My Projects</h2>

            <figure>
                <img src="project.jpg"
                     alt="Screenshot of my personal portfolio website"
                     width="300">
                <figcaption>My first portfolio project</figcaption>
            </figure>
        </section>
    </main>

</body>
</html>
